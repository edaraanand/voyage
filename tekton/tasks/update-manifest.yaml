apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: update-manifest
  namespace: tekton-pipelines
spec:
  params:
    - name: image-name
      type: string
    - name: image-tag
      type: string
  workspaces:
    - name: source
    - name: git-credentials
  steps:
    - name: bump-and-commit
      image: alpine/git:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e

        # wire up git credentials mounted from the git-credentials workspace
        cp $(workspaces.git-credentials.path)/.git-credentials ~/.git-credentials
        git config --global credential.helper store
        git config --global user.email "tekton-ci@voyage.local"
        git config --global user.name "Tekton CI"
        git config --global --add safe.directory $(workspaces.source.path)

        # bump the image line in deployment.yaml — adjust the sed pattern if your
        # deployment.yaml formats the image field differently
        sed -i "s|image: .*|image: $(params.image-name):$(params.image-tag)|" k8s/deployment.yaml

        git add k8s/deployment.yaml
        git commit -m "ci: update voyage image to $(params.image-tag)" || echo "No changes to commit"
        git push origin HEAD:main
