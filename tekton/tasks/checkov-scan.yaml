apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: checkov-scan
  namespace: tekton-pipelines
spec:
  workspaces:
    - name: source
  steps:
    - name: scan
      image: bridgecrew/checkov:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        # --soft-fail: report-only for now. Remove this flag once k8s/ manifests
        # are hardened and you're ready to block on findings.
        checkov -d k8s/ --framework kubernetes --soft-fail
