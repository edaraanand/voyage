apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: trivy-scanner
  namespace: tekton-pipelines
spec:
  params:
    - name: image
      type: string
  steps:
    - name: scan
      image: aquasec/trivy:latest
      script: |
        #!/bin/sh
        set -e
        # --exit-code 1 fails the pipeline on HIGH/CRITICAL findings.
        # Currently set to 0 (report-only) — flip to 1 once you're ready to enforce it.
        trivy image --severity HIGH,CRITICAL --exit-code 0 $(params.image)
