apiVersion: v1
kind: ServiceAccount
metadata:
  name: voyage-trigger-sa
  namespace: tekton-pipelines
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: voyage-trigger-role
  namespace: tekton-pipelines
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "pipelineresources", "taskruns"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: ["triggers.tekton.dev"]
    resources: ["eventlisteners", "triggerbindings", "triggertemplates", "clustertriggerbindings", "triggers", "interceptors"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: voyage-trigger-rolebinding
  namespace: tekton-pipelines
subjects:
  - kind: ServiceAccount
    name: voyage-trigger-sa
    namespace: tekton-pipelines
roleRef:
  kind: Role
  name: voyage-trigger-role
  apiGroup: rbac.authorization.k8s.io
---
# Cluster-scoped read access for ClusterInterceptors (e.g. the "github" interceptor)
# and ClusterTriggerBindings, which the EventListener needs to list/watch at startup
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: voyage-trigger-clusterrole
rules:
  - apiGroups: ["triggers.tekton.dev"]
    resources: ["clusterinterceptors", "clustertriggerbindings"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: voyage-trigger-clusterrolebinding
subjects:
  - kind: ServiceAccount
    name: voyage-trigger-sa
    namespace: tekton-pipelines
roleRef:
  kind: ClusterRole
  name: voyage-trigger-clusterrole
  apiGroup: rbac.authorization.k8s.io
