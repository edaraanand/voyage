name: Voyage CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

env:
  IMAGE_NAME: docker.io/edaraanand/voyage
  PYTHON_VERSION: "3.11"

jobs:
  # --- Python Quality: Flask API ---
  python-quality:
    name: Python Lint, Format & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint Python with Ruff
        run: ruff check .

      - name: Check Python formatting
        run: ruff format --check .

      - name: Security lint with Bandit
        run: bandit -r . -x ./tests,./.venv,./venv

      - name: Run Flask API tests
        run: |
          if [ -d "tests" ] && find tests -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            pytest tests/ -v
          else
            echo "No test files found; checking Python syntax only."
            python -c "import ast, pathlib; files = list(pathlib.Path('.').rglob('*.py')); files = [p for p in files if not any(x in p.parts for x in ['.git', '.venv', 'venv', '__pycache__'])]; [ast.parse(p.read_text(), filename=str(p)) for p in files]; print(f'Parsed {len(files)} Python files')"
          fi
  # --- Supply Chain Security (CKS Domain: Supply Chain Security) ---
  dockerfile-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning   # fails on warning+ (bad practices, missing pins, etc.)
          # failure-threshold: error   # fails on error (bad practices, missing pins, etc.)

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs full history to scan past commits too

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  manifest-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Static analysis of Kubernetes manifests
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: k8s/
          framework: kubernetes
          soft_fail: true   # report-only for now — set to false once manifests are hardened

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir pytest

      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -v
          else
            echo "No tests/ directory found yet — verifying app.py parses cleanly."
            python -c "import ast; ast.parse(open('app.py').read())"
          fi

  build-and-push:
    needs: [test, dockerfile-lint, secret-scan, manifest-scan]
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.vars.outputs.sha_short }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sbom:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 90

  sign-image:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for keyless signing via GitHub OIDC
      contents: read
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign image (keyless)
        run: |
          cosign sign --yes ${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}

  scan-image:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }}
          severity: HIGH,CRITICAL
          exit-code: "0"   # report-only for now — flip to "1" once you're ready to enforce it

  update-manifest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-push, scan-image, sbom, sign-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bump image tag in deployment.yaml
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }}
        run: |
          sed -i "s|image: .*|image: ${IMAGE}|" k8s/deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "ci: update voyage image to ${{ needs.build-and-push.outputs.image-tag }} [skip ci]"
          git push origin HEAD:main
