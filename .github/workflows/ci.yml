name: Voyage CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Promotions and ArgoCD config are deploy-only changes: don't rebuild the image
    # paths-ignore:
      # - "k8s/overlays/**"
      # - "argocd/**"
      # - "**.md"

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

# Cancel superseded PR runs; never cancel a run on main mid-deploy.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: docker.io/edaraanand/voyage
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1 — PR checklist (runs on PRs and on main)
  # ---------------------------------------------------------------------------

  python-quality:
    name: Python lint, format, security & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Dev tools are installed here so they stay out of the runtime image
          # Keep ruff in sync with the rev in .pre-commit-config.yaml
          pip install "ruff==0.14.10" bandit pytest

      - name: Lint with Ruff
        run: ruff check .

      - name: Check formatting with Ruff
        run: ruff format --check .

      - name: Security lint with Bandit
        run: bandit -r . -x ./tests,./.venv,./venv -q

      - name: Run tests
        run: |
          if [ -d tests ] && [ -n "$(find tests \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit)" ]; then
            pytest tests/ -v
          else
            echo "No test files found yet; checking that all Python files compile."
            python -m compileall -q -x '(\.git|\.venv|venv|__pycache__)' .
          fi

  dockerfile-lint:
    name: Dockerfile lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so past commits are scanned too

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  manifest-scan:
    name: Kubernetes manifest scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Static analysis of Kubernetes manifests
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: k8s/
          framework: kubernetes
          soft_fail: true   # report-only for now; set to false once manifests are hardened

  # PRs: build the image and scan it locally. Nothing is pushed to Docker Hub.
  build-pr:
    name: Build & scan image (PR, not pushed)
    if: github.event_name == 'pull_request'
    needs: [python-quality, dockerfile-lint, secret-scan, manifest-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: voyage:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: voyage:pr-${{ github.event.pull_request.number }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"   # report-only for now; flip to "1" to enforce

  # ---------------------------------------------------------------------------
  # Stage 2 — main only: build once, push, sign, SBOM, scan, deploy to dev
  # ---------------------------------------------------------------------------

  build-and-push:
    name: Build & push image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python-quality, dockerfile-lint, secret-scan, manifest-scan]
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.vars.outputs.sha_short }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sbom:
    name: Generate SBOM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 90

  sign-image:
    name: Sign image (cosign keyless)
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # GitHub OIDC for keyless signing
      contents: read
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign image by digest
        run: cosign sign --yes "${IMAGE_NAME}@${{ needs.build-and-push.outputs.image-digest }}"

  scan-image:
    name: Scan pushed image (Trivy)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"   # report-only for now; flip to "1" to enforce

  update-manifest:
    name: Update dev image manifest
    needs: [build-and-push, scan-image, sbom, sign-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    concurrency:
      group: voyage-manifest-dev
      cancel-in-progress: false

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        uses: mikefarah/yq@v4.45.1

      - name: Update dev image
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
          TAG: ${{ needs.build-and-push.outputs.image-tag }}
          DIGEST: ${{ needs.build-and-push.outputs.image-digest }}
          OVERLAY: k8s/overlays/dev/kustomization.yaml
        run: |
          yq -i '
            (.images[] | select(.name == strenv(IMAGE))) |=
            (.newTag = strenv(TAG) | .digest = strenv(DIGEST))
          ' "$OVERLAY"

          if ! grep -qF "$DIGEST" "$OVERLAY"; then
            echo "::error::Image digest was not updated"
            exit 1
          fi

          cat "$OVERLAY"

      - name: Commit and push dev manifest
        env:
          TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/overlays/dev/kustomization.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "ci: promote voyage $TAG to dev [skip ci]"

          for attempt in 1 2 3; do
            if git pull --rebase origin main &&
               git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed"
            sleep 5
          done

          exit 1

  promote-to-staging:
    name: Approve and promote to staging
    needs: [build-and-push, update-manifest]
    runs-on: ubuntu-latest

    environment:
      name: staging

    permissions:
      contents: write

    concurrency:
      group: voyage-manifest-staging
      cancel-in-progress: false

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        uses: mikefarah/yq@v4.45.1

      - name: Update staging image
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
          TAG: ${{ needs.build-and-push.outputs.image-tag }}
          DIGEST: ${{ needs.build-and-push.outputs.image-digest }}
          OVERLAY: k8s/overlays/staging/kustomization.yaml
        run: |
          yq -i '
            (.images[] | select(.name == strenv(IMAGE))) |=
            (.newTag = strenv(TAG) | .digest = strenv(DIGEST))
          ' "$OVERLAY"

          if ! grep -qF "$DIGEST" "$OVERLAY"; then
            echo "::error::Staging image digest was not updated"
            exit 1
          fi

      - name: Commit and push staging manifest
        env:
          TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/overlays/staging/kustomization.yaml
          git commit -m "ci: promote voyage $TAG to staging [skip ci]"

          for attempt in 1 2 3; do
            if git pull --rebase origin main &&
               git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done

          exit 1

  promote-to-production:
    name: Approve and promote to production
    needs: [build-and-push, promote-to-staging]
    runs-on: ubuntu-latest

    environment:
      name: production

    permissions:
      contents: write

    concurrency:
      group: voyage-manifest-production
      cancel-in-progress: false

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        uses: mikefarah/yq@v4.45.1

      - name: Update production image
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
          TAG: ${{ needs.build-and-push.outputs.image-tag }}
          DIGEST: ${{ needs.build-and-push.outputs.image-digest }}
          OVERLAY: k8s/overlays/prod/kustomization.yaml
        run: |
          yq -i '
            (.images[] | select(.name == strenv(IMAGE))) |=
            (.newTag = strenv(TAG) | .digest = strenv(DIGEST))
          ' "$OVERLAY"

          if ! grep -qF "$DIGEST" "$OVERLAY"; then
            echo "::error::Production image digest was not updated"
            exit 1
          fi

      - name: Commit and push production manifest
        env:
          TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/overlays/prod/kustomization.yaml
          git commit -m "ci: promote voyage $TAG to production [skip ci]"

          for attempt in 1 2 3; do
            if git pull --rebase origin main &&
               git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done

          exit 1
