# Mirrors the PR checklist in .github/workflows/ci.yaml so failures show up
# locally before you push. Run `pre-commit autoupdate` to bump hook versions.
repos:
  # Python lint + format (same tool as the CI "Python lint" job)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Python security lint (matches CI Bandit step)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: [-q]
        exclude: ^(tests|\.venv|venv)/

  # Secret scan (matches CI Gitleaks job; catches far more than detect-private-key)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  # Dockerfile lint (matches CI Hadolint job; runs via Docker, no local install)
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: [--failure-threshold, warning]

  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: no-commit-to-branch
        args: [--branch, main]
