apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: voyage
resources:
  - ../../base
# CI writes dev; the Promote workflow copies this block into staging and prod.
images:
  - name: docker.io/edaraanand/voyage
    newTag: 93ea853
    # digest: sha256:...   # filled in by CI / Promote

    digest: sha256:6b3dc7d4661b6644c47a4e2c0e9396e77ed35378b05b69e9250e4afd3bb28a8f
replicas:
  - name: voyage-matcher # metadata.name of your Deployment
    count: 3
patches:
  # Per-env hostname. Assumes the Ingress is named "voyage" with one rule.
  - target:
      kind: Ingress
      name: voyage
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: voyage.example.com
# Per-env config values. Uncomment and adjust the name/keys to your ConfigMap.
# - target:
#     kind: ConfigMap
#     name: voyage-config
#   patch: |-
#     - op: replace
#       path: /data/LOG_LEVEL
#       value: debug
