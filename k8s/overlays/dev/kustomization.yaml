apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: voyage
resources:
  - ../../base
# CI writes dev; the Promote workflow copies this block into staging and prod.
images:
  - name: docker.io/edaraanand/voyage
    newTag: 9f1f825
    # digest: sha256:...   # filled in by CI / Promote

    digest: sha256:17aba64e2c76df7c85a13a14043d4bb6e03b33983662fcace4cea61df424a721
replicas:
  - name: voyage # metadata.name of your Deployment
    count: 3
patches:
  # Per-env hostname. Assumes the Ingress is named "voyage" with one rule.
  - target:
      kind: Ingress
      name: voyage
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: voyage.example.com
# Per-env config values. Uncomment and adjust the name/keys to your ConfigMap.
# - target:
#     kind: ConfigMap
#     name: voyage-config
#   patch: |-
#     - op: replace
#       path: /data/LOG_LEVEL
#       value: debug
