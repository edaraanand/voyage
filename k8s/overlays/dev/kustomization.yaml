apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: voyage
resources:
  - ../../base
# CI writes dev; the Promote workflow copies this block into staging and prod.
images:
  - name: docker.io/edaraanand/voyage
    newTag: cd30c4c
    # digest: sha256:...   # filled in by CI / Promote

    digest: sha256:b21d3c0316226b9a3aca0fdb26c3ced46637b5b4cfa49dda039d5e83f3ca5914
replicas:
  - name: voyage # metadata.name of your Deployment
    count: 3
patches:
  # Per-env hostname. Assumes the Ingress is named "voyage" with one rule.
  - target:
      kind: Ingress
      name: voyage
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: voyage.example.com
# Per-env config values. Uncomment and adjust the name/keys to your ConfigMap.
# - target:
#     kind: ConfigMap
#     name: voyage-config
#   patch: |-
#     - op: replace
#       path: /data/LOG_LEVEL
#       value: debug
