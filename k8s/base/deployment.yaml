apiVersion: apps/v1
kind: Deployment
metadata:
  name: voyage-matcher

spec:
  replicas: 3   # overlays set the real count per env

  selector:
    matchLabels:
      app: voyage-matcher

  template:
    metadata:
      labels:
        app: voyage-matcher

      annotations:
        # Prometheus scraping
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"

    spec:
      containers:
        - name: voyage-matcher

          # Placeholder: each overlay's images: block sets the tag + digest
          image: docker.io/edaraanand/voyage:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000

          env:
            - name: CLICKHOUSE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: clickhouse-secret
                  key: CLICKHOUSE_USERNAME

            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-secret
                  key: CLICKHOUSE_PASSWORD

          envFrom:
            - configMapRef:
                name: voyage-config

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 60
